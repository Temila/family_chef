# ============================================================
# 家味 · Family Chef - 全局配置文件
# 修改后需重启后端服务生效
# ============================================================

# -------------------- 应用基础配置 --------------------
app:
  name: "家味·Family Chef"           # 应用显示名称
  version: "0.1.0"                    # 当前版本号
  debug: true                         # 调试模式，生产环境请设为 false
  secret_key: "dev-secret-key-change-in-production"  # 应用密钥，生产环境务必更换为随机长字符串

# -------------------- 数据库配置 --------------------
database:
  # 数据库连接 URL，默认使用 SQLite（异步驱动 aiosqlite）
  # 文件存储在 ./data/family_chef.db
  url: "sqlite+aiosqlite:///./data/family_chef.db"

# -------------------- JWT 认证配置 --------------------
jwt:
  secret_key: "dev-jwt-secret-key-change-in-production"  # JWT 签名密钥，生产环境务必更换
  algorithm: "HS256"                  # JWT 签名算法，一般无需修改
  expire_minutes: 1440                # Token 过期时间（分钟），1440 分钟 = 24 小时

# -------------------- 飞书集成配置 --------------------
# 用于飞书机器人消息推送等集成功能，不使用飞书功能可保持为 null
feishu:
  app_id: "cli_a923f1a94cb91bd1"                        # 飞书应用 App ID
  app_secret: "goCHICoUUNHuYatBYaL7lfkBsbRoj3aN"                    # 飞书应用 App Secret
  # TODO:暂未使用，后续集成多维表格可能用到，暂时保留
  app_token: null                     # 飞书应用 Token

# -------------------- 文件上传配置 --------------------
upload:
  dir: "./data/uploads"               # 上传文件存储目录
  max_size: 5242880                   # 单个文件最大体积（字节），5242880 = 5MB

# -------------------- 跨域资源共享（CORS）配置 --------------------
cors:
  origins:                            # 允许的前端来源地址列表
    - "*"                             # 开发环境允许所有来源，生产环境应替换为具体域名

# -------------------- 智能功能配置 --------------------
smart:
  # 总开关：控制所有智能化功能，设为 false 时所有智能功能都不生效
  enabled: true

  features:
    # 智能食材提取：使用 LLM 从文本中智能识别食材名称、数量和单位
    ingredient_extraction: true

  # 本地大语言模型（LLM）配置
  # 使用 llama-cpp-python 加载 GGUF 格式模型，支持离线推理
  llm:
    model_repo: "unsloth/Qwen3.5-0.8B-GGUF"      # HuggingFace 模型仓库名称
    model_filename: "Qwen3.5-0.8B-Q4_K_M.gguf"    # 模型文件名（Q4_K_M 量化，兼顾速度与精度）
    n_ctx: 2048                        # 模型上下文窗口长度（token 数），值越大占用显存/内存越多
    # n_gpu_layers: 0                  # 指定加载到 GPU 的层数，0 表示纯 CPU 推理；取消注释并设为 -1 可全部加载到 GPU
    # HuggingFace 镜像地址，留空则使用官方源；国内推荐 https://hf-mirror.com
    hf_mirror: "https://hf-mirror.com"
