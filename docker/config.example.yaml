# ============================================================
# 家味 · Family Chef - Docker 部署配置示例
# 复制为 config.yaml 并根据实际情况修改
# cp config.example.yaml config.yaml
# ============================================================

app:
  name: "家味·Family Chef"
  version: "0.1.0"
  debug: false
  secret_key: "CHANGE-ME-TO-A-RANDOM-LONG-STRING"

database:
  url: "sqlite+aiosqlite:///./data/family_chef.db"

jwt:
  secret_key: "CHANGE-ME-TO-A-RANDOM-LONG-STRING"
  algorithm: "HS256"
  expire_minutes: 1440

feishu:
  app_id: null
  app_secret: null
  app_token: null

upload:
  dir: "./data/uploads"
  max_size: 5242880

cors:
  origins:
    - "*"

smart:
  enabled: false
  features:
    ingredient_extraction: false
  llm:
    model_repo: "unsloth/Qwen3.5-0.8B-GGUF"
    model_filename: "Qwen3.5-0.8B-Q4_K_M.gguf"
    n_ctx: 2048
    hf_mirror: null
