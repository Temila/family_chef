services:
  family-chef:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: family-chef
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - family-chef-data:/app/data
    environment:
      - CONFIG_PATH=/app/config/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  family-chef-data:
    driver: local
