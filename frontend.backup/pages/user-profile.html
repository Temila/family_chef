<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家味 · 个人中心</title>
  <link rel="stylesheet" href="/app/css/styles.css">
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <div class="header">
      <div class="header-title">个人中心</div>
      <button class="theme-toggle">🌙</button>
    </div>

    <!-- Content -->
    <div class="content" style="padding-bottom: 80px;">
      <!-- Profile Card -->
      <div class="section">
        <div class="profile-card">
          <div class="avatar avatar-lg" id="userAvatar">U</div>
          <div class="profile-info">
            <div class="profile-name" id="userName">用户</div>
            <div class="profile-role">
              <span class="role-badge role-user" id="userRole">用户</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Taste Preferences -->
      <div class="section">
        <div class="section-title">口味偏好</div>
        <div id="preferencesContainer">
          <div class="loading">
            <div class="loading-spinner"></div>
            加载中...
          </div>
        </div>
      </div>

      <!-- Menu List -->
      <div class="section">
        <div class="menu-list">
          <div class="menu-item" onclick="App.navigate('order-dish')">
            <div class="menu-icon">⭐</div>
            <div class="menu-text">
              <div class="menu-title">我的收藏</div>
              <div class="menu-desc">查看收藏的菜品</div>
            </div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item" onclick="showPasswordModal()">
            <div class="menu-icon">🔐</div>
            <div class="menu-text">
              <div class="menu-title">修改密码</div>
              <div class="menu-desc">更新账户安全密码</div>
            </div>
            <div class="menu-arrow">›</div>
          </div>
          <div class="menu-item" onclick="handleLogout()">
            <div class="menu-icon">🚪</div>
            <div class="menu-text">
              <div class="menu-title">退出登录</div>
              <div class="menu-desc">安全退出账户</div>
            </div>
            <div class="menu-arrow">›</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-bar"></div>
  </div>

  <!-- Password Modal -->
  <div id="passwordModal" class="modal" style="display: none;">
    <div class="modal-content" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-card); border-radius: var(--radius-lg); padding: 24px; width: 90%; max-width: 400px; z-index: 1000; box-shadow: var(--shadow-lg);">
      <h3 style="font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 16px;">修改密码</h3>
      <form id="passwordForm" onsubmit="handlePasswordSubmit(event)">
        <div class="form-group">
          <label class="form-label">当前密码</label>
          <input class="form-input" type="password" id="currentPassword" required>
        </div>
        <div class="form-group">
          <label class="form-label">新密码</label>
          <input class="form-input" type="password" id="newPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">确认新密码</label>
          <input class="form-input" type="password" id="confirmPassword" required>
        </div>
        <div id="passwordError" class="form-error"></div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">确认修改</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app/js/auth.js"></script>
  <script src="/app/js/api.js"></script>
  <script src="/app/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 检查认证
      if (!Auth.requireAuth('/login.html')) return;

      // 初始化底部导航
      App.initBottomNav('user-profile');

      // 加载用户信息
      loadUserInfo();

      // 加载口味偏好
      loadPreferences();
    });

    async function loadUserInfo() {
      const user = Auth.getUser();
      if (user) {
        document.getElementById('userName').textContent = user.display_name || user.username;
        document.getElementById('userRole').textContent = Auth.getRoleLabel();
        document.getElementById('userAvatar').textContent = (user.display_name || user.username).charAt(0).toUpperCase();
        
        const roleBadge = document.getElementById('userRole');
        roleBadge.className = `role-badge role-${user.role}`;
      }
    }

    async function loadPreferences() {
      const container = document.getElementById('preferencesContainer');
      try {
        const [preferencesRes, ingredientsRes] = await Promise.all([
          API.getPreferences(),
          API.getIngredients()
        ]);

        // 创建食材名称映射
        const ingredientMap = {};
        ingredientsRes.items?.forEach(ing => {
          ingredientMap[ing.id] = ing.name;
        });

        const dislikes = preferencesRes.dislikes || [];
        const allergies = preferencesRes.allergies || [];

        if (dislikes.length === 0 && allergies.length === 0) {
          container.innerHTML = `
            <div class="info-pills">
              <span style="color: var(--text-muted); font-size: 0.9rem;">暂无设置偏好</span>
            </div>
          `;
          return;
        }

        let html = '';
        
        if (dislikes.length > 0) {
          const dislikeNames = dislikes.map(id => ingredientMap[id] || '未知食材');
          html += `<div style="margin-bottom: 12px;">
            <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">不喜食材：</div>
            <div class="info-pills">
              ${dislikeNames.map(name => `<span class="info-pill">🚫 ${name}</span>`).join('')}
            </div>
          </div>`;
        }

        if (allergies.length > 0) {
          const allergyNames = allergies.map(id => ingredientMap[id] || '未知食材');
          html += `<div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px;">过敏源：</div>
            <div class="info-pills">
              ${allergyNames.map(name => `<span class="badge badge-danger">${name}</span>`).join('')}
            </div>
          </div>`;
        }

        container.innerHTML = html;
      } catch (err) {
        console.error('加载偏好设置失败:', err);
        container.innerHTML = `<div style="color: var(--danger); font-size: 0.9rem;">加载失败</div>`;
      }
    }

    function showPasswordModal() {
      document.getElementById('passwordModal').style.display = 'block';
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').style.display = 'none';
      document.getElementById('passwordForm').reset();
      document.getElementById('passwordError').classList.remove('show');
    }

    async function handlePasswordSubmit(e) {
      e.preventDefault();
      const errEl = document.getElementById('passwordError');
      errEl.classList.remove('show');

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        errEl.textContent = '两次输入的新密码不一致';
        errEl.classList.add('show');
        return;
      }

      try {
        const user = Auth.getUser();
        await API.updatePassword(user.id, currentPassword, newPassword);
        App.showToast('密码修改成功');
        closePasswordModal();
      } catch (err) {
        errEl.textContent = err.message || '密码修改失败';
        errEl.classList.add('show');
      }
    }

    function handleLogout() {
      if (confirm('确定要退出登录吗？')) {
        Auth.clear();
        App.showToast('已退出登录');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 500);
      }
    }
  </script>
</body>
</html>
