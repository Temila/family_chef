<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家味 · 点菜</title>
  <link rel="stylesheet" href="/app/css/styles.css">
</head>
<body>
<div class="page-container">
  <!-- Header -->
  <div class="header">
    <div class="header-title">🍽 今日菜单</div>
    <div class="header-actions">
      <button class="btn-icon" id="filterBtn" title="筛选">🔽</button>
    </div>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索菜品..." oninput="handleSearch()">
  </div>

  <!-- Filter Chips -->
  <div class="filter-chips" id="filterChips">
    <button class="filter-chip active" data-filter="all">全部</button>
  </div>

  <!-- Dish Grid -->
  <div class="dish-grid" id="dishGrid"></div>

  <!-- Cart Summary Bar -->
  <div class="cart-bar" id="cartBar" style="display:none;">
    <div>
      <span style="font-size:0.85rem;color:var(--text-muted);">已选 </span>
      <span id="cartCount" style="font-weight:600;color:var(--accent);">0</span>
      <span style="font-size:0.85rem;color:var(--text-muted);"> 道菜</span>
    </div>
    <button class="btn btn-primary" onclick="submitOrder()">提交订单</button>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar" id="bottomBar"></div>
</div>

<script src="/app/js/auth.js"></script>
<script src="/app/js/api.js"></script>
<script src="/app/js/app.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error();

let allDishes = [];
let categories = [];
let cart = {}; // dish_id -> quantity

document.addEventListener('DOMContentLoaded', async () => {
  App.initBottomNav('order-dish');
  await loadCategories();
  await loadDishes();
});

async function loadCategories() {
  try {
    categories = await API.getCategories();
    const chips = document.getElementById('filterChips');
    categories.forEach(c => {
      chips.innerHTML += `<button class="filter-chip" data-filter="${c.id}">${c.name}</button>`;
    });
    chips.addEventListener('click', e => {
      if (!e.target.classList.contains('filter-chip')) return;
      chips.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      const filter = e.target.dataset.filter;
      const search = document.getElementById('searchInput').value.toLowerCase();
      filterDishes(filter, search);
    });
  } catch (err) {
    console.error('加载分类失败:', err);
  }
}

async function loadDishes() {
  const grid = document.getElementById('dishGrid');
  App.showLoading(grid);
  try {
    const res = await API.getDishes({ page_size: 50 });
    allDishes = res.items.filter(d => d.status === 'published');
    filterDishes('all', '');
  } catch (err) {
    grid.innerHTML = App.emptyState('😢', '加载失败：' + err.message);
  }
}

function filterDishes(filter, search) {
  let dishes = allDishes;
  if (filter !== 'all') {
    dishes = dishes.filter(d => d.categories?.some(c => c.id === parseInt(filter)));
  }
  if (search) {
    dishes = dishes.filter(d => d.name.toLowerCase().includes(search));
  }
  renderDishes(dishes);
}

function handleSearch() {
  const activeChip = document.querySelector('.filter-chip.active');
  const filter = activeChip ? activeChip.dataset.filter : 'all';
  const search = document.getElementById('searchInput').value.toLowerCase();
  filterDishes(filter, search);
}

function renderDishes(dishes) {
  const grid = document.getElementById('dishGrid');
  if (!dishes.length) {
    grid.innerHTML = App.emptyState('🍽', '暂无菜品');
    return;
  }
  grid.innerHTML = dishes.map((d, i) => {
    const qty = cart[d.id] || 0;
    const emoji = d.image_url ? `<img src="${d.image_url}" alt="${d.name}">` : '<div class="placeholder-img">🍲</div>';
    return `
      <div class="dish-card animate-fade-in stagger-${(i % 4) + 1}" onclick="goToDetail(${d.id})">
        <div class="dish-card-image">${emoji}</div>
        <div class="dish-card-body">
          <div class="dish-card-name">${d.name}</div>
          <div class="dish-card-meta">${(d.categories || []).map(c => c.name).join(' · ') || '未分类'}</div>
          <div class="dish-card-footer">
            ${qty > 0 ? `<span style="color:var(--accent);font-weight:600;font-size:0.85rem;">×${qty}</span>` : ''}
            <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();addToCart(${d.id})">
              ${qty > 0 ? '+ 加菜' : '加入订单'}
            </button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function addToCart(dishId) {
  cart[dishId] = (cart[dishId] || 0) + 1;
  updateCartBar();
  const activeChip = document.querySelector('.filter-chip.active');
  const filter = activeChip ? activeChip.dataset.filter : 'all';
  const search = document.getElementById('searchInput').value.toLowerCase();
  filterDishes(filter, search);
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const total = Object.values(cart).reduce((a, b) => a + b, 0);
  document.getElementById('cartCount').textContent = total;
  bar.style.display = total > 0 ? 'flex' : 'none';
}

function goToDetail(id) {
  window.location.href = `dish-detail.html?id=${id}`;
}

async function submitOrder() {
  const items = Object.entries(cart).map(([dish_id, quantity]) => ({ dish_id: parseInt(dish_id), quantity }));
  if (!items.length) return;
  try {
    await API.createOrder({ items });
    App.showToast('订单已提交 🎉');
    cart = {};
    updateCartBar();
    filterDishes('all', '');
  } catch (err) {
    App.showToast('提交失败：' + err.message, 'error');
  }
}
</script>
</body>
</html>
