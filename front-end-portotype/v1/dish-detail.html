<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 菜品详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: #1976d2;
            cursor: pointer;
        }
        .dish-cover {
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 80px;
            margin-bottom: 20px;
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .dish-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
        }
        .tag-region { background: #e3f2fd; color: #1976d2; }
        .tag-flavor { background: #fff3e0; color: #f57c00; }
        .tag-season { background: #e8f5e9; color: #388e3c; }
        .ingredients-list {
            list-style: none;
        }
        .ingredients-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .ingredients-list li:last-child {
            border-bottom: none;
        }
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-favorite {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-order {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="alert('返回')">← 返回</div>
        </div>

        <div class="dish-cover">🍜</div>

        <div class="section">
            <div class="dish-name">麻婆豆腐</div>
            <div class="tags">
                <span class="tag tag-region">中餐 · 川菜</span>
                <span class="tag tag-flavor">辣</span>
                <span class="tag tag-season">四季</span>
            </div>
            <p style="color: #666; margin-bottom: 15px;">经典川菜，麻辣鲜香，豆腐嫩滑，肉末香酥</p>

            <h3 style="margin-bottom: 10px;">食材清单</h3>
            <ul class="ingredients-list">
                <li><span>嫩豆腐</span><span>400g</span></li>
                <li><span>猪肉末</span><span>100g</span></li>
                <li><span>豆瓣酱</span><span>2勺</span></li>
                <li><span>花椒粉</span><span>适量</span></li>
                <li><span>葱</span><span>适量</span></li>
                <li><span>姜</span><span>适量</span></li>
                <li><span>蒜</span><span>适量</span></li>
            </ul>

            <div class="actions">
                <button class="btn-favorite">⭐ 收藏</button>
                <button class="btn-order">🛒 点菜</button>
            </div>
        </div>
    </div>
</body>
</html>
