<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 菜品管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: #1976d2;
            cursor: pointer;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 10px 20px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .add-btn {
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: #666;
            font-weight: normal;
        }
        td {
            padding: 12px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .btn-edit {
            padding: 6px 12px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-delete {
            padding: 6px 12px;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        .page-btn.active {
            background: #1976d2;
            color: white;
            border-color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="alert('返回')">← 返回</div>
            <h2>菜品管理</h2>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="搜索菜名..." />
            <button>搜索</button>
            <button class="add-btn" onclick="alert('添加菜品')">+ 添加菜品</button>
        </div>

        <div class="table">
            <table>
                <thead>
                    <tr>
                        <th>菜名</th>
                        <th>地区</th>
                        <th>菜系</th>
                        <th>食材数</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>麻婆豆腐</td>
                        <td>中餐</td>
                        <td>川菜</td>
                        <td>7</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit">编辑</button>
                                <button class="btn-delete">删除</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>红烧牛肉</td>
                        <td>中餐</td>
                        <td>川菜</td>
                        <td>8</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit">编辑</button>
                                <button class="btn-delete">删除</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>意大利面</td>
                        <td>西餐</td>
                        <td>意大利</td>
                        <td>6</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit">编辑</button>
                                <button class="btn-delete">删除</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>三文鱼寿司</td>
                        <td>日料</td>
                        <td>-</td>
                        <td>4</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit">编辑</button>
                                <button class="btn-delete">删除</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>咖喱鸡</td>
                        <td>印度菜</td>
                        <td>-</td>
                        <td>9</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit">编辑</button>
                                <button class="btn-delete">删除</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">下一页</button>
        </div>
    </div>
</body>
</html>
