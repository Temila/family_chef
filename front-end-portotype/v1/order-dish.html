<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 点菜页面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 10px 20px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group label {
            font-size: 13px;
            color: #666;
        }
        .filter-group select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .dish-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s;
            position: relative;
        }
        .dish-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .dish-image {
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }
        .dish-info {
            padding: 15px;
        }
        .dish-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .dish-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .tag-region { background: #e3f2fd; color: #1976d2; }
        .tag-flavor { background: #fff3e0; color: #f57c00; }
        .tag-season { background: #e8f5e9; color: #388e3c; }
        .dish-actions {
            display: flex;
            gap: 10px;
        }
        .btn-favorite {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-order {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }
        .warning-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            color: white;
        }
        .warning-dislike { background: #ff9800; }
        .warning-allergy { background: #f44336; }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px 20px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-count {
            font-size: 16px;
            font-weight: bold;
        }
        .confirm-btn {
            padding: 10px 30px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-bar">
                <input type="text" placeholder="搜索菜名或食材..." />
                <button>搜索</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>地区：</label>
                    <select>
                        <option>全部</option>
                        <option>中餐</option>
                        <option>西餐</option>
                        <option>日料</option>
                        <option>印度菜</option>
                        <option>东南亚菜</option>
                        <option>黑暗料理界</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>菜系：</label>
                    <select>
                        <option>全部</option>
                        <option>鲁菜</option>
                        <option>川菜</option>
                        <option>粤菜</option>
                        <option>苏菜</option>
                        <option>浙菜</option>
                        <option>闽菜</option>
                        <option>湘菜</option>
                        <option>徽菜</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>口味：</label>
                    <select>
                        <option>全部</option>
                        <option>酸</option>
                        <option>甜</option>
                        <option>苦</option>
                        <option>辣</option>
                        <option>咸</option>
                        <option>鲜</option>
                        <option>麻</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>季节：</label>
                    <select>
                        <option>全部</option>
                        <option>春</option>
                        <option>夏</option>
                        <option>秋</option>
                        <option>冬</option>
                        <option>四季</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="dish-card">
                <div class="dish-image">🍜</div>
                <div class="dish-info">
                    <div class="dish-name">麻婆豆腐</div>
                    <div class="dish-tags">
                        <span class="tag tag-region">中餐</span>
                        <span class="tag tag-flavor">辣</span>
                        <span class="tag tag-season">四季</span>
                    </div>
                    <div class="dish-actions">
                        <button class="btn-favorite">⭐ 收藏</button>
                        <button class="btn-order">🛒 点菜</button>
                    </div>
                </div>
            </div>

            <div class="dish-card">
                <div class="warning-tag warning-dislike">包含你不爱吃的食材：葱</div>
                <div class="dish-image">🥩</div>
                <div class="dish-info">
                    <div class="dish-name">红烧牛肉</div>
                    <div class="dish-tags">
                        <span class="tag tag-region">中餐</span>
                        <span class="tag tag-flavor">咸</span>
                        <span class="tag tag-season">秋冬</span>
                    </div>
                    <div class="dish-actions">
                        <button class="btn-favorite">⭐ 收藏</button>
                        <button class="btn-order">🛒 点菜</button>
                    </div>
                </div>
            </div>

            <div class="dish-card">
                <div class="warning-tag warning-allergy">包含你严格忌口的食材：花生</div>
                <div class="dish-image">🦐</div>
                <div class="dish-info">
                    <div class="dish-name">宫保鸡丁</div>
                    <div class="dish-tags">
                        <span class="tag tag-region">中餐</span>
                        <span class="tag tag-flavor">辣</span>
                        <span class="tag tag-season">四季</span>
                    </div>
                    <div class="dish-actions">
                        <button class="btn-favorite">⭐ 收藏</button>
                        <button class="btn-order">🛒 点菜</button>
                    </div>
                </div>
            </div>

            <div class="dish-card">
                <div class="dish-image">🍝</div>
                <div class="dish-info">
                    <div class="dish-name">意大利面</div>
                    <div class="dish-tags">
                        <span class="tag tag-region">西餐</span>
                        <span class="tag tag-flavor">酸</span>
                        <span class="tag tag-season">四季</span>
                    </div>
                    <div class="dish-actions">
                        <button class="btn-favorite">⭐ 收藏</button>
                        <button class="btn-order">🛒 点菜</button>
                    </div>
                </div>
            </div>

            <div class="dish-card">
                <div class="dish-image">🍣</div>
                <div class="dish-info">
                    <div class="dish-name">三文鱼寿司</div>
                    <div class="dish-tags">
                        <span class="tag tag-region">日料</span>
                        <span class="tag tag-flavor">鲜</span>
                        <span class="tag tag-season">四季</span>
                    </div>
                    <div class="dish-actions">
                        <button class="btn-favorite">⭐ 收藏</button>
                        <button class="btn-order">🛒 点菜</button>
                    </div>
                </div>
            </div>

            <div class="dish-card">
                <div class="dish-image">🍛</div>
                <div class="dish-info">
                    <div class="dish-name">咖喱鸡</div>
                    <div class="dish-tags">
                        <span class="tag tag-region">印度菜</span>
                        <span class="tag tag-flavor">辣</span>
                        <span class="tag tag-season">秋冬</span>
                    </div>
                    <div class="dish-actions">
                        <button class="btn-favorite">⭐ 收藏</button>
                        <button class="btn-order">🛒 点菜</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="order-count">已点 3 道菜</div>
        <button class="confirm-btn" onclick="alert('确认点菜流程')">确认点菜</button>
    </div>
</body>
</html>
