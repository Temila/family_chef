<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 用户端首页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .user-details h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: #e3f2fd;
            color: #1976d2;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .card-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            font-size: 14px;
        }
        .logout-btn {
            margin-top: 30px;
            text-align: center;
        }
        .logout-btn button {
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            background: #ff5252;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn button:hover {
            background: #ff1744;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="user-info">
                <div class="avatar">张</div>
                <div class="user-details">
                    <h2>张三</h2>
                    <span class="role-badge">家庭成员</span>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card" onclick="alert('跳转到点菜页面')">
                <div class="card-icon">🍽️</div>
                <h3>开始点菜</h3>
                <p>浏览菜单，选择心仪的菜品</p>
            </div>
            <div class="card" onclick="alert('跳转到个人中心')">
                <div class="card-icon">👤</div>
                <h3>个人中心</h3>
                <p>管理个人信息和口味偏好</p>
            </div>
            <div class="card" onclick="alert('跳转到订单查看')">
                <div class="card-icon">📋</div>
                <h3>订单查看</h3>
                <p>查看历史订单和点菜记录</p>
            </div>
        </div>

        <div class="logout-btn">
            <button onclick="alert('退出登录')">退出登录</button>
        </div>
    </div>
</body>
</html>
