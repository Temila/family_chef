<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 个人中心</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: #1976d2;
            cursor: pointer;
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-primary {
            padding: 10px 20px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-secondary {
            padding: 10px 20px;
            background: white;
            color: #1976d2;
            border: 1px solid #1976d2;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .preference-section {
            margin-top: 20px;
        }
        .preference-group {
            margin-bottom: 20px;
        }
        .preference-group h4 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #666;
        }
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .tag {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag-dislike {
            background: #fff3e0;
            color: #f57c00;
        }
        .tag-allergy {
            background: #ffebee;
            color: #d32f2f;
        }
        .tag-remove {
            cursor: pointer;
            font-weight: bold;
        }
        .search-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .btn-add {
            padding: 8px 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="alert('返回')">← 返回</div>
            <h2>个人中心</h2>
        </div>

        <div class="section">
            <h3>基本信息</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" value="张三" />
            </div>
            <div class="form-group">
                <label>角色</label>
                <input type="text" value="家庭成员" disabled style="background: #f5f5f5;" />
            </div>
            <button class="btn-primary">保存修改</button>
        </div>

        <div class="section">
            <h3>修改密码</h3>
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" placeholder="请输入旧密码" />
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" placeholder="请输入新密码（至少6位）" />
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" placeholder="请再次输入新密码" />
            </div>
            <button class="btn-primary">修改密码</button>
        </div>

        <div class="section">
            <h3>口味偏好</h3>
            <p style="color: #666; font-size: 14px; margin-bottom: 15px;">管理您的饮食偏好，系统将据此提示菜品中的食材信息</p>

            <div class="preference-group">
                <h4>不爱吃的食材（黄色提示）</h4>
                <div class="tag-list">
                    <div class="tag tag-dislike">
                        葱
                        <span class="tag-remove" onclick="alert('删除')">×</span>
                    </div>
                    <div class="tag tag-dislike">
                        香菜
                        <span class="tag-remove" onclick="alert('删除')">×</span>
                    </div>
                    <div class="tag tag-dislike">
                        胡萝卜
                        <span class="tag-remove" onclick="alert('删除')">×</span>
                    </div>
                </div>
                <input type="text" class="search-input" placeholder="搜索食材添加..." />
                <button class="btn-add">添加</button>
            </div>

            <div class="preference-group">
                <h4>严格忌口食材（红色提示）</h4>
                <div class="tag-list">
                    <div class="tag tag-allergy">
                        花生
                        <span class="tag-remove" onclick="alert('删除')">×</span>
                    </div>
                    <div class="tag tag-allergy">
                        海鲜
                        <span class="tag-remove" onclick="alert('删除')">×</span>
                    </div>
                </div>
                <input type="text" class="search-input" placeholder="搜索食材添加..." />
                <button class="btn-add">添加</button>
            </div>
        </div>
    </div>
</body>
</html>
