<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 厨师订单</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 15px;
            color: #1976d2;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .order-image {
            height: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }
        .order-info {
            padding: 15px;
        }
        .order-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .order-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }
        .btn-complete {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #4caf50;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-complete:hover {
            background: #388e3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn" onclick="alert('返回')">← 返回</div>
            <h2>待做订单</h2>
        </div>

        <div class="grid">
            <div class="order-card">
                <div class="order-image">🍜</div>
                <div class="order-info">
                    <div class="order-name">麻婆豆腐</div>
                    <div class="order-meta">
                        <span>点菜人：张三</span>
                        <span>14:30</span>
                    </div>
                    <button class="btn-complete" onclick="alert('确认完成？')">✓ 标记完成</button>
                </div>
            </div>

            <div class="order-card">
                <div class="order-image">🥩</div>
                <div class="order-info">
                    <div class="order-name">红烧牛肉</div>
                    <div class="order-meta">
                        <span>点菜人：李四</span>
                        <span>14:35</span>
                    </div>
                    <button class="btn-complete" onclick="alert('确认完成？')">✓ 标记完成</button>
                </div>
            </div>

            <div class="order-card">
                <div class="order-image">🍝</div>
                <div class="order-info">
                    <div class="order-name">意大利面</div>
                    <div class="order-meta">
                        <span>点菜人：王五</span>
                        <span>14:40</span>
                    </div>
                    <button class="btn-complete" onclick="alert('确认完成？')">✓ 标记完成</button>
                </div>
            </div>

            <div class="order-card">
                <div class="order-image">🍣</div>
                <div class="order-info">
                    <div class="order-name">三文鱼寿司</div>
                    <div class="order-meta">
                        <span>点菜人：张三</span>
                        <span>14:45</span>
                    </div>
                    <button class="btn-complete" onclick="alert('确认完成？')">✓ 标记完成</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
