<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭点菜系统 - 管理端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            background: #ffebee;
            color: #d32f2f;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .card-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .card p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>管理端</h2>
                <span class="admin-badge">超级管理员</span>
            </div>
            <button onclick="alert('退出登录')" style="padding: 8px 16px; background: #ff5252; color: white; border: none; border-radius: 6px; cursor: pointer;">退出</button>
        </div>

        <div class="grid">
            <div class="card" onclick="alert('跳转到用户管理')">
                <div class="card-icon">👥</div>
                <h3>用户管理</h3>
                <p>管理所有用户账号</p>
            </div>
            <div class="card" onclick="alert('跳转到菜品管理')">
                <div class="card-icon">🍽️</div>
                <h3>菜品管理</h3>
                <p>管理菜品信息和菜谱</p>
            </div>
            <div class="card" onclick="alert('跳转到食材管理')">
                <div class="card-icon">🥬</div>
                <h3>食材管理</h3>
                <p>管理食材库和别名</p>
            </div>
            <div class="card" onclick="alert('跳转到厨师管理')">
                <div class="card-icon">👨‍🍳</div>
                <h3>厨师管理</h3>
                <p>管理厨师账号和飞书绑定</p>
            </div>
            <div class="card" onclick="alert('跳转到分类管理')">
                <div class="card-icon">📂</div>
                <h3>分类管理</h3>
                <p>管理地区、菜系、口味等分类</p>
            </div>
        </div>
    </div>
</body>
</html>
