<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家味 · 菜品详情</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-container">

  <!-- Header -->
  <div class="header" style="position:relative;z-index:10;">
    <button class="header-back">←</button>
    <div class="header-title">菜品详情</div>
    <div class="header-actions">
      <button class="btn-icon" style="color:var(--accent-warm);border-color:var(--accent-warm);background:rgba(212,118,60,0.1);">♥</button>
    </div>
  </div>

  <!-- Dish Image -->
  <div style="width:100%;aspect-ratio:4/3;background:linear-gradient(135deg, var(--bg-elevated), var(--bg-card-hover));display:flex;align-items:center;justify-content:center;font-size:5rem;position:relative;">
    🌶️
    <div style="position:absolute;bottom:12px;right:12px;display:flex;gap:6px;">
      <span class="badge badge-warn">🌶 辣</span>
      <span class="badge badge-info">川菜</span>
    </div>
  </div>

  <!-- Dish Info -->
  <div class="section animate-fade-in">
    <div style="margin-bottom:8px;">
      <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--text-primary);">麻婆豆腐</div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-top:2px;">Mapo Tofu · 川菜经典</div>
    </div>
  </div>

  <!-- Tags -->
  <div class="section" style="padding:0 16px 16px;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <span class="badge badge-info">川菜</span>
      <span class="badge badge-warn">🌶 辣</span>
      <span class="badge badge-success">🌸 春季</span>
      <span class="badge badge-gold">⭐ 热门</span>
    </div>
  </div>

  <!-- Ingredients -->
  <div class="section" style="padding:0 16px 16px;">
    <div class="section-title">🥘 主要食材</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      <span class="badge badge-info">豆腐</span>
      <span class="badge badge-info">猪肉末</span>
      <span class="badge badge-info">豆瓣酱</span>
      <span class="badge badge-info">花椒</span>
      <span class="badge badge-info">辣椒</span>
      <span class="badge badge-info">蒜苗</span>
    </div>
  </div>

  <!-- Dietary Warning -->
  <div class="section" style="padding:0 16px 16px;">
    <div style="background:rgba(90,154,90,0.08);border:1px solid rgba(90,154,90,0.2);border-radius:var(--radius-md);padding:12px 14px;display:flex;align-items:center;gap:10px;">
      <div style="font-size:1.3rem;">✅</div>
      <div>
        <div style="font-size:0.85rem;font-weight:500;color:var(--accent-green-light);">安全菜品</div>
        <div style="font-size:0.75rem;color:var(--text-muted);">不含您不爱吃或忌口的食材</div>
      </div>
    </div>
  </div>

  <!-- Description -->
  <div class="section" style="padding:0 16px 16px;">
    <div class="section-title">📝 菜品介绍</div>
    <div style="font-size:0.85rem;color:var(--text-secondary);line-height:1.8;">
      麻婆豆腐是川菜中的经典名菜。主要原料为豆腐，辅以牛肉末（或猪肉末）、豆瓣酱、花椒等调料。口感麻辣鲜香，豆腐嫩滑，肉末酥香，是下饭的绝佳选择。
    </div>
  </div>

  <!-- Nutrition -->
  <div class="section" style="padding:0 16px 16px;">
    <div class="section-title">📊 营养信息（每100g）</div>
    <div class="grid-3" style="gap:8px;">
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--accent-gold);">156</div>
        <div style="font-size:0.7rem;color:var(--text-muted);">热量/kcal</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--accent-warm-light);">8.1g</div>
        <div style="font-size:0.7rem;color:var(--text-muted);">蛋白质</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:#7ab0d0;">10.2g</div>
        <div style="font-size:0.7rem;color:var(--text-muted);">脂肪</div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="section" style="padding:0 16px 24px;">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" style="flex:0 0 auto;padding:14px 18px;">
        <span style="font-size:1.1rem;">♡</span>
      </button>
      <button class="btn btn-primary btn-lg" style="flex:1;">
        🛒 加入订单
      </button>
    </div>
  </div>

</div>
</body>
</html>
