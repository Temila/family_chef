<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家味 · 首页</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-container">

  <!-- Header -->
  <div class="header">
    <div class="flex items-center gap-3">
      <div class="avatar avatar-sm">T</div>
      <div>
        <div style="font-size:0.9rem;font-weight:600;color:var(--text-primary)">Temila</div>
        <div style="font-size:0.7rem;color:var(--text-muted)">家庭厨师 · 超级管理员</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" title="通知">🔔</button>
      <button class="btn-icon" title="设置">⚙️</button>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="section animate-fade-in">
    <div style="background:linear-gradient(135deg, rgba(212,118,60,0.12), rgba(201,168,76,0.08));border:1px solid rgba(212,118,60,0.15);border-radius:var(--radius-lg);padding:24px 20px;text-align:center;position:relative;overflow:hidden;">
      <div style="position:absolute;top:-20px;right:-10px;font-size:4rem;opacity:0.08;">🍜</div>
      <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:4px;">晚上好，今天想吃什么？</div>
      <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">家味 · Family Chef</div>
      <div style="font-size:1.5rem;letter-spacing:8px;">🥘 🍲 🥟 🍛</div>
    </div>
  </div>

  <!-- Quick Stats -->
  <div class="section pt-0 animate-fade-in stagger-1">
    <div class="grid-3" style="gap:8px;">
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 10px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--accent-gold);">12</div>
        <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">本周已点</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 10px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--accent-warm-light);">8</div>
        <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">我的收藏</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 10px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--accent-red-light);">3</div>
        <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">忌口食材</div>
      </div>
    </div>
  </div>

  <!-- Main Actions -->
  <div class="section animate-fade-in stagger-2">
    <div class="section-title">🍽 快捷入口</div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="background:linear-gradient(135deg, var(--accent-warm), var(--accent-warm-light));border-radius:var(--radius-lg);padding:24px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(212,118,60,0.3);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
        <div style="font-size:2.5rem;">👨‍🍳</div>
        <div>
          <div style="font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:white;">开始点菜</div>
          <div style="font-size:0.8rem;color:rgba(255,255,255,0.8);margin-top:2px;">浏览菜品，为家人挑选美味</div>
        </div>
        <div style="margin-left:auto;font-size:1.5rem;color:rgba(255,255,255,0.6);">→</div>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--border-medium)'" onmouseout="this.style.borderColor='var(--border-subtle)'">
        <div style="font-size:2rem;">👤</div>
        <div>
          <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--text-primary);">个人中心</div>
          <div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px;">管理个人信息与口味偏好</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </div>
    </div>
  </div>

  <!-- Recent Orders -->
  <div class="section animate-fade-in stagger-3">
    <div class="section-title">📋 最近订单</div>
    <div class="card">
      <div class="list-item">
        <div class="order-item-img">🥘</div>
        <div class="order-item-info">
          <div class="order-item-name">红烧肉 · 麻婆豆腐 · 番茄炒蛋</div>
          <div class="order-item-meta">今天 10:30 · 待厨师确认</div>
        </div>
        <span class="badge badge-warn">进行中</span>
      </div>
      <div class="list-item">
        <div class="order-item-img">🍛</div>
        <div class="order-item-info">
          <div class="order-item-name">咖喱鸡 · 清蒸鲈鱼 · 白饭</div>
          <div class="order-item-meta">昨天 18:00 · 已完成</div>
        </div>
        <span class="badge badge-success">已完成</span>
      </div>
      <div class="list-item">
        <div class="order-item-img">🥟</div>
        <div class="order-item-info">
          <div class="order-item-name">饺子拼盘 · 酸辣汤</div>
          <div class="order-item-meta">周五 12:00 · 已完成</div>
        </div>
        <span class="badge badge-success">已完成</span>
      </div>
    </div>
  </div>

  <!-- Spacer for bottom bar -->
  <div style="height:80px;"></div>

  <!-- Bottom Tab Bar -->
  <div class="bottom-bar">
    <div style="display:flex;justify-content:space-around;align-items:center;">
      <div style="text-align:center;cursor:pointer;">
        <div style="font-size:1.3rem;">🏠</div>
        <div style="font-size:0.7rem;color:var(--accent-warm);font-weight:600;margin-top:2px;">首页</div>
      </div>
      <div style="text-align:center;cursor:pointer;opacity:0.5;">
        <div style="font-size:1.3rem;">🍽</div>
        <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">点菜</div>
      </div>
      <div style="text-align:center;cursor:pointer;opacity:0.5;">
        <div style="font-size:1.3rem;">👤</div>
        <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">我的</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
