name: Validate branch name

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name pattern
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          if [[ ! "$SOURCE_BRANCH" =~ ^(feature/|fix/|dev|main)$ ]]; then
            echo "::error::Branch name '$SOURCE_BRANCH' is invalid. Branch names must start with 'feature/' or 'fix/'"
            exit 1
          fi
          echo "✅ Branch name '$SOURCE_BRANCH' is valid"
