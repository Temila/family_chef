name: Enforce PR target rules

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  enforce-target:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          # feature/* 和 fix/* 只能向 dev 提 PR
          if [[ "$SOURCE_BRANCH" =~ ^(feature/|fix/) ]] && [[ "$TARGET_BRANCH" != "dev" ]]; then
            echo "::error::PRs from '$SOURCE_BRANCH' must target 'dev', not '$TARGET_BRANCH'"
            gh pr close "${{ github.event.pull_request.number }}" \
              --comment "⛔ 来自 \`$SOURCE_BRANCH\` 的 PR 只能以 \`dev\` 为目标分支，当前目标是 \`$TARGET_BRANCH\`。已自动关闭。" \
              --repo "${{ github.repository }}"
            exit 1
          fi

          # 只有 dev 能向 main 提 PR
          if [[ "$TARGET_BRANCH" == "main" ]] && [[ "$SOURCE_BRANCH" != "dev" ]]; then
            echo "::error::Only 'dev' can PR to 'main', not '$SOURCE_BRANCH'"
            gh pr close "${{ github.event.pull_request.number }}" \
              --comment "⛔ 只有 \`dev\` 分支可以向 \`main\` 提 PR，当前源分支是 \`$SOURCE_BRANCH\`。已自动关闭。" \
              --repo "${{ github.repository }}"
            exit 1
          fi

          echo "✅ Target branch '$TARGET_BRANCH' is valid for source '$SOURCE_BRANCH'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
